<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Won'tBuy</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; background: #0b1020; color: #f4f7ff; }
    .banner { padding: .7rem 1rem; background: #f6c945; color: #211b00; text-align: center; font-weight: 700; }
    main { width: min(900px, calc(100% - 2rem)); margin: 4rem auto; }
    .eyebrow { color: #8da2fb; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: .5rem 0; font-size: clamp(2.5rem, 8vw, 5rem); }
    p { color: #b9c2da; font-size: 1.2rem; max-width: 62ch; }
    .rounds { display: flex; gap: .75rem; margin-top: 2rem; }
    .card { margin-top: 1rem; padding: 1.5rem; border: 1px solid #29324d; border-radius: 1rem; background: #121a2e; }
    button { border: 0; border-radius: .6rem; padding: .8rem 1rem; background: #7186f4; color: white; font-weight: 700; cursor: pointer; }
    button:hover { background: #8799f7; }
  </style>
</head>
<body>
  <div class="banner">Simulated campaign — not connected to live ads</div>
  <main>
    <div class="eyebrow">Agentic marketing lab</div>
    <h1>Won'tBuy</h1>
    <p>Diagnose whether a campaign is reaching the wrong people or saying the wrong thing.</p>
    <nav class="rounds" aria-label="Campaign rounds">
      <button type="button" data-round="1">Load round 1</button>
      <button type="button" data-round="2">Load round 2</button>
    </nav>
    <section class="card" id="campaign" aria-live="polite">Loading round one…</section>
  </main>
  <script>
    const campaignPanel = document.querySelector('#campaign');

    function loadRound(round) {
      campaignPanel.textContent = `Loading round ${round}…`;
      fetch(`/api/round/${round}`)
        .then((response) => {
          if (!response.ok) throw new Error('Round could not be loaded.');
          return response.json();
        })
        .then(({ campaign, targeting_accuracy: accuracy }) => {
          campaignPanel.innerHTML = `
            <div class="eyebrow">Round ${round} · ${campaign.company}</div>
            <h2>${campaign.ad.headline}</h2>
            <p>${campaign.ad.body}</p>
            <p>Targeting accuracy: ${accuracy}%</p>
            <button type="button">${campaign.ad.cta}</button>`;
        })
        .catch(() => {
          campaignPanel.textContent = `Round ${round} could not be loaded.`;
        });
    }

    document.querySelectorAll('[data-round]').forEach((button) => {
      button.addEventListener('click', () => loadRound(button.dataset.round));
    });

    loadRound(1);
  </script>
</body>
</html>
