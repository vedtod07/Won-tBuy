<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Won'tBuy</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, sans-serif;
      --bg: #0b1020;
      --surface: #121a2e;
      --surface-raised: #18233d;
      --border: #29324d;
      --text: #f4f7ff;
      --muted: #aeb9d3;
      --accent: #7186f4;
      --warning: #f6c945;
      --success: #58d6a9;
      --danger: #e2708a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 1.25rem 1.5rem 3rem; }

    header.banner {
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      padding: .65rem 1rem; margin-bottom: 1.25rem;
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    }
    .brand { font-weight: 700; font-size: 1.15rem; }
    .brand .lab { color: var(--muted); font-weight: 500; font-size: .95rem; }
    .mode-pill {
      display: inline-flex; align-items: center; gap: .4rem;
      padding: .3rem .7rem; border-radius: 999px; font-size: .8rem; font-weight: 600;
      border: 1px solid var(--border);
    }
    .mode-pill.live { color: var(--success); border-color: var(--success); }
    .mode-pill.cached { color: var(--warning); border-color: var(--warning); }
    .sim-note { color: var(--muted); font-size: .8rem; text-align: right; }

    .actions {
      display: flex; flex-wrap: wrap; gap: .6rem; margin-bottom: 1.25rem;
    }
    button.btn {
      font: inherit; cursor: pointer;
      background: var(--surface-raised); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px;
      padding: .55rem .95rem; font-weight: 600;
      transition: background .15s ease, opacity .15s ease;
    }
    button.btn:hover:not(:disabled) { background: #22304f; }
    button.btn:disabled { opacity: .45; cursor: not-allowed; }
    button.btn.primary { background: var(--accent); color: #0b1020; border-color: var(--accent); }
    button.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }

    .layout {
      display: grid; grid-template-columns: 1fr 1.15fr; gap: 1.25rem; align-items: start;
    }
    @media (max-width: 880px) { .layout { grid-template-columns: 1fr; } }

    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 1rem 1.15rem; margin-bottom: 1rem;
    }
    .eyebrow {
      font-size: .72rem; letter-spacing: .08em; text-transform: uppercase;
      color: var(--muted); margin-bottom: .55rem; font-weight: 700;
    }
    .section-title { font-size: .8rem; }

    .agent-panel { position: sticky; top: 1rem; }
    .feed { list-style: none; padding: 0; margin: 0; min-height: 6rem; }
    .feed li {
      padding: .45rem .6rem; border-left: 2px solid var(--accent);
      margin-bottom: .5rem; background: var(--surface-raised); border-radius: 4px;
      font-size: .88rem; animation: feed-in .25s ease;
    }
    .feed li.role { color: var(--muted); font-size: .78rem; border-left-color: var(--border); }
    @keyframes feed-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

    .spinner {
      display: inline-block; width: 14px; height: 14px; margin-right: .4rem;
      border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .chips { display: flex; flex-wrap: wrap; gap: .4rem; }
    .chip {
      background: var(--surface-raised); border: 1px solid var(--border);
      border-radius: 999px; padding: .2rem .65rem; font-size: .8rem; color: var(--muted);
    }
    .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; margin: .75rem 0; }
    .metric {
      background: var(--surface-raised); border: 1px solid var(--border);
      border-radius: 10px; padding: .8rem .95rem; text-align: center;
    }
    .metric .value { font-size: 1.7rem; font-weight: 800; line-height: 1.1; }
    .metric .label { font-size: .75rem; color: var(--muted); margin-top: .25rem; }

    .ad-card, .preview { background: var(--surface-raised); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; margin-top: .5rem; }
    .ad-card h2, .preview h2 { margin: 0 0 .4rem; font-size: 1.05rem; }
    .ad-card p, .preview p { margin: 0 0 .6rem; color: var(--muted); }
    .bullet { margin: .25rem 0 .25rem 1rem; color: var(--muted); }
    .proof { color: var(--success); font-size: .85rem; margin: .5rem 0; font-weight: 600; }
    .highlight { font-weight: 700; color: var(--accent); margin: .5rem 0; padding-left: .8rem; border-left: 3px solid var(--accent); }
    .price { font-weight: 700; margin: .4rem 0; }

    .cta-btn {
      display: inline-block; cursor: default;
      background: var(--accent); color: #0b1020; font-weight: 700;
      border-radius: 8px; padding: .55rem 1.1rem; margin-top: .4rem;
      box-shadow: 0 2px 0 rgba(0,0,0,.25);
    }
    .cta-btn.neutral { background: var(--surface); color: var(--text); border: 1px solid var(--border); box-shadow: none; }

    .personas { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: .75rem; }
    .persona {
      background: var(--surface-raised); border: 1px solid var(--border);
      border-radius: 10px; padding: .85rem .95rem;
    }
    .persona.loud { border-color: var(--danger); box-shadow: 0 0 0 2px rgba(226,112,138,.35); }
    .persona .name { font-weight: 700; }
    .persona .seg { font-size: .72rem; color: var(--muted); margin-bottom: .4rem; }
    .persona .verdict { font-weight: 700; margin: .4rem 0 .2rem; }
    .persona .verdict.click { color: var(--success); }
    .persona .verdict.noclick { color: var(--danger); }
    .persona .verdict.unreached { color: var(--muted); }
    .persona .quote { font-style: italic; color: var(--text); margin: .4rem 0 .2rem; }
    .persona .reason { font-size: .82rem; color: var(--muted); }

    .email-card { margin-top: .5rem; }
    .email-card .subj { font-weight: 700; margin-bottom: .3rem; }
    .email-card .body { color: var(--muted); white-space: pre-line; font-size: .88rem; }

    details.brief-section { margin: 1rem 0; }
    details.brief-section summary { cursor: pointer; color: var(--muted); font-size: .9rem; }
    .brief-section form { display: flex; flex-direction: column; gap: .5rem; margin-top: .5rem; }
    .brief-section textarea { width: 100%; padding: .5rem; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 6px; font: inherit; resize: vertical; }
    .brief-error { color: var(--danger); font-size: .85rem; margin-top: .3rem; }
    .brief-sample { color: var(--muted); font-size: .85rem; margin-top: .3rem; font-style: italic; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="banner">
      <div class="brand">Won'tBuy <span class="lab">· Agentic marketing lab</span></div>
      <div>
        <span id="mode-pill" class="mode-pill cached">Checking…</span>
        <div class="sim-note">Simulated campaign — not connected to live ads</div>
      </div>
    </header>

    <div class="actions">
      <button class="btn primary" data-round="1" id="btn-r1">Run leak check</button>
      <button class="btn" data-round="2" id="btn-r2">Tighten targeting</button>
      <button class="btn" data-round="3" id="btn-r3">Fix the copy</button>
      <button class="btn" id="export-btn">Export campaign.md</button>
    </div>

    <details class="brief-section">
      <summary>Custom brief (experimental)</summary>
      <form id="brief-form">
        <textarea id="brief-input" rows="3" placeholder="Describe your product, target buyer, and price…"></textarea>
        <button type="submit" class="btn">Run custom campaign</button>
      </form>
      <div id="brief-error" class="brief-error"></div>
      <div id="brief-sample" class="brief-sample"></div>
    </details>

    <div class="layout">
      <section class="card agent-panel">
        <div class="eyebrow section-title">Agent activity</div>
        <ul class="feed" id="feed"></ul>
      </section>

      <section id="dashboard"></section>
    </div>
  </div>

  <script>
    const state = { data: null, loading: false };
    const feedEl = document.getElementById('feed');
    const dashEl = document.getElementById('dashboard');
    const modePill = document.getElementById('mode-pill');
    const buttons = {
      1: document.getElementById('btn-r1'),
      2: document.getElementById('btn-r2'),
      3: document.getElementById('btn-r3'),
    };

    function setMode(live) {
      modePill.textContent = live ? 'Live Gemini' : 'Cached';
      modePill.className = 'mode-pill ' + (live ? 'live' : 'cached');
    }

    function setLoading(loading) {
      state.loading = loading;
      Object.values(buttons).forEach((b) => (b.disabled = loading));
      document.getElementById('export-btn').disabled = loading;
    }

    function renderPersona(p) {
      const isLoud = p.is_icp === false && p.reached && p.would_click;
      let verdict, verdictClass;
      if (!p.reached) {
        verdict = 'Not reached this round';
        verdictClass = 'unreached';
      } else if (p.would_click) {
        verdict = 'Would click';
        verdictClass = 'click';
      } else {
        verdict = 'Would not click';
        verdictClass = 'noclick';
      }
      const quote = p.quote ? `<div class="quote">“${p.quote}”</div>` : '';
      const reason = p.reason ? `<div class="reason">${p.reason}</div>` : '';
      return `
        <article class="persona ${isLoud ? 'loud' : ''}">
          <div class="name">${p.name}</div>
          <div class="seg">${p.segment === 'student' ? 'student' : 'ICP · plant manager'}</div>
          <div class="verdict ${verdictClass}">${verdict}</div>
          ${quote}
          ${reason}
        </article>`;
    }

    function render(data) {
      state.data = data;
      const c = data.campaign;
      const round = data.round || 0;

      const chips = Object.entries(c.targeting || {}).map(([group, values]) =>
        values.map((v) => `<span class="chip">${String(v).replace(/_/g, ' ')}</span>`).join('')
      ).join('');

      const bullets = (c.page.bullets && c.page.bullets.length)
        ? c.page.bullets.map((b) => `<div class="bullet">• ${b}</div>`).join('')
        : '';
      const pageBody = (c.page.bullets && c.page.bullets.length) || !c.page.body
        ? ''
        : `<p>${c.page.body}</p>`;
      const proof = c.page.proof ? `<div class="proof">${c.page.proof}</div>` : '';
      const highlight = c.page.highlight ? `<div class="highlight">${c.page.highlight}</div>` : '';
      const price = c.page.price ? `<div class="price">${c.page.price}</div>` : '<div class="price">no price</div>';

      const email = c.email ? `
        <div class="card email-card">
          <div class="eyebrow">Email follow-up</div>
          <div class="subj">${c.email.subject}</div>
          <div class="body">${c.email.body}</div>
        </div>` : '';

      const personas = (data.personas || []).map(renderPersona).join('');

      dashEl.innerHTML = `
        <section class="card">
          <div class="eyebrow">${round === 0 ? 'Custom campaign' : 'Round ' + round} · ${c.company}</div>

          <div class="eyebrow section-title">Paid targeting</div>
          <div class="chips">${chips}</div>

          <div class="metrics">
            <div class="metric"><div class="value">${data.targeting_accuracy}%</div><div class="label">Targeting accuracy</div></div>
            <div class="metric"><div class="value">${data.icp_purchase_rate}</div><div class="label">ICP purchase rate</div></div>
          </div>

          ${data.critic_summary ? `<div class="eyebrow section-title">Funnel critic</div><p style="margin:0 0 .5rem">${data.critic_summary}</p>` : ''}

          <div class="eyebrow section-title">Ad</div>
          <div class="ad-card">
            <h2>${c.ad.headline}</h2>
            <p>${c.ad.body}</p>
            <span class="cta-btn ${c.ad.cta === 'Learn more' ? 'neutral' : ''}">${c.ad.cta}</span>
          </div>

          <div class="eyebrow section-title" style="margin-top:1rem">Landing page</div>
          <div class="preview">
            <h2>${c.page.headline}</h2>
            ${highlight}
            ${pageBody}
            ${bullets}
            ${proof}
            ${price}
            <span class="cta-btn ${c.page.cta === 'Learn more' ? 'neutral' : ''}">${c.page.cta}</span>
          </div>

          ${email}
        </section>

        <section>
          <div class="eyebrow section-title">Audience</div>
          <div class="personas">${personas}</div>
        </section>`;
    }

    function renderFeed(feed) {
      feedEl.innerHTML = '';
      feed.forEach((line, i) => {
        const li = document.createElement('li');
        li.textContent = line;
        li.className = line.endsWith(':') ? 'role' : '';
        feedEl.appendChild(li);
      });
    }

    async function loadRound(round) {
      if (state.loading) return;
      setLoading(true);
      renderFeed(['Working…']);
      try {
        const res = await fetch('/api/round/' + round);
        const data = await res.json();
        render(data);
        renderFeed(data.agent_feed || []);
      } catch (err) {
        renderFeed(['Error loading round — check the server.']);
      } finally {
        setLoading(false);
      }
    }

    document.querySelectorAll('[data-round]').forEach((btn) => {
      btn.addEventListener('click', () => loadRound(btn.dataset.round));
    });

    document.getElementById('export-btn').addEventListener('click', () => {
      window.location.href = '/api/export/campaign.md';
    });

    // Load initial status + round 1.
    async function boot() {
      try {
        const res = await fetch('/api/status');
        const st = await res.json();
        setMode(st.live);
      } catch (e) {
        setMode(false);
      }
      loadRound(1);
    }

    // Custom brief.
    document.getElementById('brief-form').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const errorBox = document.getElementById('brief-error');
      const sampleBox = document.getElementById('brief-sample');
      errorBox.textContent = '';
      sampleBox.textContent = '';
      const brief = document.getElementById('brief-input').value;
      try {
        const res = await fetch('/api/custom', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ brief }),
        });
        const data = await res.json();
        if (!res.ok || data.error) {
          errorBox.textContent = data.error || data.detail || 'Server error — try the sample brief.';
          if (data.sample) sampleBox.textContent = 'Sample: ' + data.sample;
          return;
        }
        render(data);
        renderFeed(data.agent_feed || []);
      } catch (err) {
        errorBox.textContent = 'Request failed — check that the server is running.';
      }
    });

    boot();
  </script>
</body>
</html>
